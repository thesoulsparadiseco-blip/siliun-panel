services:
  # ---- Backend Admin API (FastAPI) ----
  - type: web
    name: siliun-backend
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SILIUN_ADMIN_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://tu-sitio.webflow.io"
      - key: RESONANCE_THRESHOLD
        value: "70"
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: DATA_DIR
        value: "./data"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: "claude-sonnet-5"
      - key: AGENT_TOKEN
        sync: false
      - key: AGENT_DAILY_LIMIT
        value: "300"
    # NOTE: free tier does not support persistent disks. DATA_DIR is
    # ephemeral here -- data resets on every redeploy. Migrate storage.py
    # to Postgres (Render offers a free instance) before onboarding real
    # users, or upgrade this service to a paid plan and re-add a disk.

  # ---- Admin Panel UI (Streamlit) ----
  - type: web
    name: siliun-panel-ui
    env: python
    plan: free
    buildCommand: "pip install -r panel/requirements.txt"
    startCommand: "streamlit run panel/streamlit_app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: API_BASE
        value: "https://siliun-backend.onrender.com"
      - key: SILIUN_ADMIN_TOKEN
        sync: false
      - key: ADMIN_ID
        value: "admin"

  # ---- Sistema de llamadas: registro offline + video llamada/chat grupal ----
  - type: web
    name: siliun-offline-calls
    env: python
    plan: free
    buildCommand: "pip install -r offline-calls/requirements.txt"
    startCommand: "cd offline-calls && uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
    # NOTE: el estado de las salas de video/chat vive en memoria del
    # proceso. El plan free de Render duerme el servicio tras inactividad
    # y lo reinicia con cada deploy, así que las salas activas se pierden
    # en esos casos (no afecta al registro offline, que vive en el
    # localStorage de cada navegador).
